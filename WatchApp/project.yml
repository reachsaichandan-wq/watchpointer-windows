# XcodeGen spec for the watch app (https://github.com/yonaskolb/XcodeGen, free and open source).
# Generate the Xcode project on a Mac or a CI macOS runner with:
#   brew install xcodegen && cd WatchApp && xcodegen generate
# The generated WatchPointer.xcodeproj is not committed (it is reproducible from this file).
#
# Layout: a watch app that runs independently (it talks to the PC on its own), embedded in a minimal iPhone app.
# The iPhone app exists so the build can be packaged as a standard .ipa (Payload/WatchPointerPhone.app/Watch/…),
# which is what Windows sideloading tools and TestFlight expect. With Xcode on a Mac you can still run the
# WatchPointer (watch) scheme straight onto the watch.
name: WatchPointer
options:
  bundleIdPrefix: com.sandareddysaichandan
  deploymentTarget:
    watchOS: "11.0"
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 sandareddysaichandan. MIT License."
    CODE_SIGN_STYLE: Automatic
    # Set DEVELOPMENT_TEAM (your Team ID) when signing on a Mac, e.g. xcodebuild DEVELOPMENT_TEAM=XXXXXXXXXX.
    DEVELOPMENT_TEAM: ""
    # Single source of truth for the bundle identifiers. The watch app's ID and its WKCompanionAppBundleIdentifier
    # are derived from it, so they always match the iPhone app (iOS silently refuses to offer a watch app whose IDs
    # don't line up). Override for a whole build with: xcodebuild ... WP_BUNDLE_ID=com.yourname.watchpointer
    WP_BUNDLE_ID: com.sandareddysaichandan.watchpointer
packages:
  WatchCore:
    path: WatchCore
targets:
  WatchPointer:
    # Single-target watch app (watchOS 7+ style).
    type: application
    platform: watchOS
    sources:
      - path: WatchPointer
    dependencies:
      - package: WatchCore
    settings:
      base:
        # Derived from WP_BUNDLE_ID: must be the iPhone app's identifier plus a suffix.
        PRODUCT_BUNDLE_IDENTIFIER: $(WP_BUNDLE_ID).watchkitapp
        PRODUCT_NAME: WatchPointer
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: WatchPointer
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Sends pointer movement to your PC over Bluetooth."
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: $(WP_BUNDLE_ID)
        # The watch app never needs the iPhone app at runtime.
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
        ENABLE_PREVIEWS: YES
    scheme:
      gatherCoverageData: false

  WatchPointerPhone:
    type: application
    platform: iOS
    sources:
      - path: WatchPointerPhone
    dependencies:
      # Embed the watch app in WatchPointerPhone.app/Watch/ ("Embed Watch Content").
      - target: WatchPointer
        embed: true
        codeSign: true
        copy:
          destination: productsDirectory
          subpath: "$(CONTENTS_FOLDER_PATH)/Watch"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WP_BUNDLE_ID)
        PRODUCT_NAME: WatchPointerPhone
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: WatchPointer
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    scheme:
      gatherCoverageData: false
