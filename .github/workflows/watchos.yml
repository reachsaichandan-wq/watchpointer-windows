name: watchOS app

# Builds the watch app on GitHub's macOS runners, which are free for public repositories
# (private repositories consume the account's included minutes at a higher macOS rate).
# The output is UNSIGNED: it proves the code compiles and the tests pass. Installing on a real
# Apple Watch still needs code signing (see docs/WATCH_INSTALL.md).

on:
  push:
    branches: [main]
    paths: ["WatchApp/**", "Shared/**", ".github/workflows/watchos.yml"]
  pull_request:
    paths: ["WatchApp/**", "Shared/**", ".github/workflows/watchos.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests-linux:
    # Pure-Swift logic (protocol, aim math, gestures) on the cheapest runner.
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: WatchApp/WatchCore
        run: swift test

  build-watch-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode and SDKs
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i watch

      - name: Core tests on macOS
        working-directory: WatchApp/WatchCore
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: WatchApp
        run: xcodegen generate

      - name: Build for watchOS Simulator
        working-directory: WatchApp
        run: |
          set -o pipefail
          xcodebuild build \
            -project WatchPointer.xcodeproj -scheme WatchPointer \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO | tee build-sim.log | tail -n 40

      - name: Build for watchOS device (unsigned)
        working-directory: WatchApp
        run: |
          set -o pipefail
          xcodebuild build \
            -project WatchPointer.xcodeproj -scheme WatchPointer \
            -destination 'generic/platform=watchOS' \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tee build-device.log | tail -n 40

      - name: Package unsigned app
        working-directory: WatchApp
        run: |
          APP=$(find build/device/Build/Products -name "WatchPointer.app" -maxdepth 3 | head -n 1)
          echo "Built $APP"
          ditto -c -k --keepParent "$APP" WatchPointer-unsigned-watchos.zip

      - name: Build iPhone app with embedded watch app (unsigned)
        working-directory: WatchApp
        run: |
          set -o pipefail
          xcodebuild build \
            -project WatchPointer.xcodeproj -scheme WatchPointerPhone \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/phone \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tee build-phone.log | tail -n 40

      - name: Package and check unsigned .ipa
        working-directory: WatchApp
        run: |
          set -euo pipefail
          APP=$(find build/phone/Build/Products/Release-iphoneos -maxdepth 1 -name "WatchPointerPhone.app" | head -n 1)
          test -n "$APP"
          WATCH="$APP/Watch/WatchPointer.app"
          echo "Checking $WATCH"
          test -d "$WATCH" || { echo "::error::Watch app is not embedded in the iPhone app"; ls -la "$APP"; exit 1; }
          echo "iPhone bundle id: $(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")"
          echo "Watch bundle id:  $(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$WATCH/Info.plist")"
          echo "Watch companion:  $(/usr/libexec/PlistBuddy -c 'Print WKCompanionAppBundleIdentifier' "$WATCH/Info.plist")"
          echo "Watch platform:   $(/usr/libexec/PlistBuddy -c 'Print DTPlatformName' "$WATCH/Info.plist")"
          lipo -info "$WATCH/WatchPointer"
          rm -rf ipa && mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../WatchPointer-unsigned.ipa Payload)
          unzip -l WatchPointer-unsigned.ipa | grep -E "Watch/WatchPointer.app/(WatchPointer|Info.plist)$"
          ls -la WatchPointer-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: WatchPointer-watchOS-unsigned
          path: |
            WatchApp/WatchPointer-unsigned-watchos.zip
            WatchApp/build-*.log

      - uses: actions/upload-artifact@v4
        with:
          name: WatchPointer-unsigned-ipa
          path: WatchApp/WatchPointer-unsigned.ipa
