name: watchOS TestFlight (optional, paid Apple Developer Program)

# OPTIONAL and NOT VERIFIED by this project (it needs a paid account to test). It is the only route that installs
# the watch app without you ever touching a Mac: CI signs with an App Store Connect API key and uploads to
# TestFlight, then you install from the TestFlight app on your iPhone. It costs the Apple Developer Program fee
# (USD 99/year at the time of writing). App Store Connect API keys are not available to free Apple IDs.
#
# Required repository secrets:
#   ASC_KEY_ID        App Store Connect API key ID
#   ASC_ISSUER_ID     Issuer ID
#   ASC_KEY_P8_BASE64 The .p8 private key, base64-encoded
#   APPLE_TEAM_ID     Your 10-character Team ID
#   BUNDLE_ID         A bundle identifier registered to your team (e.g. com.yourname.watchpointer)
# You must also create the app record in App Store Connect once (same bundle ID).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          if [ -z "$ASC_KEY_ID" ]; then
            echo "::error::App Store Connect secrets are not configured. See the comments at the top of this workflow."
            exit 1
          fi

      - name: Prepare API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Generate project
        working-directory: WatchApp
        run: brew install xcodegen && xcodegen generate

      - name: Archive (automatic signing with the API key)
        working-directory: WatchApp
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project WatchPointer.xcodeproj -scheme WatchPointer \
            -destination 'generic/platform=watchOS' \
            -archivePath build/WatchPointer.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" | tail -n 60

      - name: Upload to TestFlight
        working-directory: WatchApp
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/WatchPointer.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
